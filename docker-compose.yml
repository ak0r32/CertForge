version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cyberprep
      POSTGRES_PASSWORD: cyberprep
      POSTGRES_DB: cyberprep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cyberprep:cyberprep@db:5432/cyberprep
    depends_on:
      - db

volumes:
  postgres_data:
